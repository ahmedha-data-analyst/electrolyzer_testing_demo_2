# Provisional engineering registry for the local NextGen dashboard template.
# Source: NX-PID-001 prototype, page 1, plus the alarm thresholds supplied by Ahmed/Taqi.
# This is a dashboard configuration aid, not an approved alarm set-point schedule.

status_palette:
  NORMAL: "#499823"      # HydroStar green
  L: "#F6A609"           # amber
  H: "#F6A609"           # amber
  LL: "#D32F2F"          # red
  HH: "#D32F2F"          # red
  UNKNOWN: "#8C919A"     # grey: missing/stale/unavailable
  UNCONFIGURED: "#8C919A" # grey: no approved limits configured

alarm_precedence: [HH, LL, H, L, NORMAL, UNCONFIGURED, UNKNOWN]

level_conversion:
  raw_source_unit: cm
  engineering_unit: mm
  rule: "level_deviation_mm = baseline_distance_mm - (raw_distance_cm * 10)"
  explanation: "For an ultrasonic sensor above the liquid, a smaller measured distance means a higher liquid level."
  baseline_distance_mm: null
  thresholds_relative_to_baseline_mm:
    LL: -10.0
    L: -5.0
    H: 5.0
    HH: 10.0

sensors:
  - internal_key: LT001
    pid_tag: LT-001
    display_name: Electrolyte Level 1 (Cathode)
    description: "Primary level transmitter monitoring liquid level in the Halopod."
    group_id: 1
    group_name: Halopod core monitoring
    critical: true
    measurement: level_deviation
    unit: mm
    provisional_v1_source: distance_cm
    source_mode: live_in_hybrid
    limits: {LL: -10.0, L: -5.0, H: 5.0, HH: 10.0}
    notes: "Requires a configured baseline distance before live values can be interpreted as level."
    pid_highlight:
      x: 30.42
      y: 22.09

  - internal_key: TT001
    pid_tag: TT-001
    display_name: Halopod Temperature
    description: "Temperature transmitter monitoring process temperature in the Halopod."
    group_id: 1
    group_name: Halopod core monitoring
    critical: true
    measurement: temperature
    unit: "°C"
    provisional_v1_source: temp_1_c
    source_mode: live_in_hybrid
    limits: {LL: null, L: null, H: 50.0, HH: 60.0}
    pid_highlight:
      x: 35.57
      y: 22.09

  - internal_key: PT001
