legacy_electrical_channel:
  source_column: voltage_v
  display_name: Stack DC Voltage
  unit: V
  role: top_kpi_not_one_of_the_16_pid_process_sensors
  power_rule: "Do not calculate stack power from voltage alone. Add a current signal first, then power_kW = voltage_V * current_A / 1000."

items_requiring_engineering_confirmation:
  - Approved baseline distance for LT-001 and LT-002
  - Whether the supplied TT and PT upper limits apply to all TT/PT tags or only selected instruments
  - L and LL limits for temperature, pressure and gas-quality instruments, if required
  - Flow alarm limits for FT-001, FT-002, FT-003 and FT-004
  - Conductivity unit and alarm limits for CT-001
  - Formal confirmation of the working AIT-001 and AIT-002 gas analyser tags
  - Resolution of the duplicated FT-003 tag in NX-PID-001
  - Final engineering units, scaling and calibration for every channel
  - Current and auxiliary-power signals needed for stack and system efficiency
  - Whether efficiency is reported on an HHV or LHV basis